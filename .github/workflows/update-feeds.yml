name: Update Radar Feeds

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch feeds
        run: python scripts/update_feeds.py
      - name: Commit updated feed snapshot
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add data/feeds.json
          git diff --cached --quiet || git commit -m "Update Radar feeds"
          git push
          
